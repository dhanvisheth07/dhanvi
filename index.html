<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhanvi Sheth</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fff7f9;
      text-align: center;
      padding: 40px 20px;
      color: #444;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3em;
      color: #e96b9d;
      margin-bottom: 10px;
    }
    img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffe6ef;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .links {
      margin-top: 30px;
    }
    a {
      display: inline-block;
      margin: 12px;
      padding: 14px 30px;
      background-color: #ffe1eb;
      color: #e96b9d;
      text-decoration: none;
      border-radius: 30px;
      font-size: 1.1em;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }
    a:hover {
      background-color: #e96b9d;
      color: white;
    }
    .fade-in {
      opacity: 0;
      animation: fadeIn ease 1.2s forwards;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="fade-in">
    <!-- Optional profile image (replace with your image URL or remove) -->
    <img src="https://i.imgur.com/jQbZ4P0.png" alt="Profile Picture">

  </div>
</body>
</html>
